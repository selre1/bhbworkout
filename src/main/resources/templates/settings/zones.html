<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragments.html :: head"></head>

<body class="bg-light">
<div th:replace="fragments.html :: main-nav"></div>
<div class="container">
    <div class="row mt-5 justify-content-center">
        <div class="col-2">
            <div th:replace="fragments.html :: settings-menu (currentMenu='zones')"></div>
        </div>
        <div class="col-8">
            <div class="row">
                <h2 class="col-sm-12">주요 활동 지역</h2>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <div class="alert alert-info" role="alert">
                        스터디를 다닐 수 있는 지역을 등록하세요.
                    </div>
                    <!--자동완성에서 div로 값을 받아두고  스크립트에서 변환해서 입력해버림-->
                    <div id="whitelist" th:text="${whitelist}" hidden></div>
                    <!-- List<String> tags = List.of("aaa", "bbb", "ccc")   => aaa,bbb,ccc  -->
                    <input id="zones" type="text" name="zones" th:value="${#strings.listJoin(zones, ',')}"
                           class="tagify-outside" aria-describedby="tagHelp"/>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="fragments.html :: footer"></div>
    <script th:replace="fragments.html :: ajax-csrf-header"></script>
    <!-- npm install @yaireo/tagify@3.5.1 -->
    <script src="/node_modules/@yaireo/tagify/dist/tagify.min.js"></script>

    <script type="application/javascript">
        $(function(){
            function tagRequest(url,zoneName) {
                $.ajax({
                    dataType: "json",
                    autocomplete: {
                        enabled: true,
                        rightKey: true
                    },
                    contentType: "application/json; charset=utf-8",
                    method: "POST",
                    url: "/settings/zones" + url,
                    data: JSON.stringify({'zoneName': zoneName})
                }).done(function (data, status) {
                    console.log("${data} and status is ${status}")
                });
            }
            function onAdd(e){
                tagRequest("/add", e.detail.data.value);
            }

            function onRemove(e){
                tagRequest("/remove", e.detail.data.value);
            }

            var tagInput = document.querySelector("#zones");

            var tagify = new Tagify(tagInput,{
                enforceWhitelist:true,
                whitelist: JSON.parse(document.querySelector("#whitelist").textContent),
                dropdown: {
                    enabled: 1
                }
            });

            tagify.on("add", onAdd);
            tagify.on("remove", onRemove);
            // add a class to Tagify's input element
            tagify.DOM.input.classList.add('form-control');
            // re-place Tagify's input element outside of the  element (tagify.DOM.scope), just before it
            tagify.DOM.scope.parentNode.insertBefore(tagify.DOM.input, tagify.DOM.scope);
        });
    </script>
</div>
</body>
</html>
